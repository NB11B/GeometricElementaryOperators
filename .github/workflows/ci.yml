name: C Kernel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        precision: [double, float]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
          fi

      - name: Configure
        shell: bash
        run: |
          if [ "${{ matrix.precision }}" = "double" ]; then
            USE_DOUBLE=ON
          else
            USE_DOUBLE=OFF
          fi

          cmake \
            -S . \
            -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEO_BUILD_TESTS=ON \
            -DGEO_BUILD_BENCHMARKS=ON \
            -DGEO_USE_DOUBLE="$USE_DOUBLE" \
            2>&1 | tee configure.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure 2>&1 | tee test.log

      - name: Generate benchmark report
        if: matrix.compiler == 'gcc' && matrix.precision == 'float'
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --target benchmark_report 2>&1 | tee benchmark.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-${{ matrix.compiler }}-${{ matrix.precision }}
          path: |
            configure.log
            build.log
            test.log
            benchmark.log
            build/benchmark-report/benchmark_report.csv
            build/benchmark-report/benchmark_report.json
            build/benchmark-report/benchmark_report.md
          if-no-files-found: ignore

  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        precision: [double, float]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure sanitizer build
        shell: bash
        run: |
          if [ "${{ matrix.precision }}" = "double" ]; then
            USE_DOUBLE=ON
          else
            USE_DOUBLE=OFF
          fi
          CC=clang cmake \
            -S . \
            -B build-sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGEO_BUILD_TESTS=ON \
            -DGEO_BUILD_BENCHMARKS=OFF \
            -DGEO_ENABLE_SANITIZERS=ON \
            -DGEO_USE_DOUBLE="$USE_DOUBLE" \
            2>&1 | tee sanitizer-configure.log

      - name: Build sanitizer targets
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-sanitize --parallel 2>&1 | tee sanitizer-build.log

      - name: Run sanitizer tests
        shell: bash
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -o pipefail
          ctest --test-dir build-sanitize --output-on-failure 2>&1 | tee sanitizer-test.log

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-${{ matrix.precision }}
          path: |
            sanitizer-configure.log
            sanitizer-build.log
            sanitizer-test.log
          if-no-files-found: ignore

  rtl-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install RTL tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Generate RTL and schedule
        run: |
          python3 tools/generate_rtl.py \
            --out-dir build-rtl \
            --schedule-json rtl/examples/rotor_action_schedule.json \
            --self-test

      - name: Simulate fixed-point Cl(2,0) product
        run: |
          iverilog -g2012 \
            -s tb_geo_cl20_product_q \
            -o build-rtl/cl20_tb.vvp \
            build-rtl/geo_cl20_product_q.sv \
            build-rtl/tb_geo_cl20_product_q.sv
          vvp build-rtl/cl20_tb.vvp | tee rtl-simulation.log

      - name: Synthesize product cell
        run: |
          yosys -p 'read_verilog -sv build-rtl/geo_cl20_product_q.sv; synth -top geo_cl20_product_q; stat' \
            2>&1 | tee rtl-synthesis.log

      - name: Upload RTL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtl-validation
          path: |
            build-rtl/*.sv
            build-rtl/*.json
            rtl-simulation.log
            rtl-synthesis.log
          if-no-files-found: error
